<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lim Bo Seng — Not Your History Textbook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    @font-face {
      font-family: "Poppins";
      src: url("Poppins-Regular.woff2") format("woff2"),
           url("Poppins-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Poppins";
      src: url("Poppins-Bold.woff2") format("woff2"),
           url("Poppins-Bold.woff") format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Poppins";
      src: url("Poppins-Black.woff2") format("woff2"),
           url("Poppins-Black.woff") format("woff");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --white: #f2f2eb;
      --yellow: #fae3ac;
      --blue: #01344f;
      --dark: #1a1a1a;
      --light: #ababab;
      --muted-button: #2a2a2a;
      --muted-button-border: rgba(242, 242, 235, 0.14);
      --story-width: 920px;
      --panel-border: rgba(242, 242, 235, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--dark);
      color: var(--white);
      font-family: "Lato", sans-serif;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
    }

    body.mobile-nav-open {
      overflow: hidden;
      height: 100dvh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .topbar {
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 200;
      background: var(--dark);
    }

    .brand {
      font-family: "Poppins", sans-serif;
      font-size: 1.05rem;
      color: var(--yellow);
      white-space: nowrap;
    }

    .mobile-menu-btn {
      display: none;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      padding: 0;
      position: relative;
      z-index: 1100;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-menu-btn-bar {
      position: absolute;
      width: 24px;
      height: 2px;
      background: var(--yellow);
      left: 50%;
      transform: translateX(-50%);
      transition: transform 0.22s ease, opacity 0.22s ease, background-color 0.22s ease, top 0.22s ease, bottom 0.22s ease;
    }

    .mobile-menu-btn-bar:nth-child(1) {
      top: 14px;
    }

    .mobile-menu-btn-bar:nth-child(2) {
      top: 21px;
    }

    .mobile-menu-btn-bar:nth-child(3) {
      top: 28px;
    }

    .mobile-menu-btn[aria-expanded="true"] .mobile-menu-btn-bar {
      background: var(--white);
    }

    .mobile-menu-btn[aria-expanded="true"] .mobile-menu-btn-bar:nth-child(1) {
      top: 21px;
      transform: translateX(-50%) rotate(45deg);
    }

    .mobile-menu-btn[aria-expanded="true"] .mobile-menu-btn-bar:nth-child(2) {
      opacity: 0;
    }

    .mobile-menu-btn[aria-expanded="true"] .mobile-menu-btn-bar:nth-child(3) {
      top: 21px;
      transform: translateX(-50%) rotate(-45deg);
    }

    .divider {
      height: 1px;
      background: rgba(242, 242, 235, 0.45);
      width: 100%;
      position: relative;
      z-index: 200;
    }

    .navbar {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: flex-start;
      padding: 18px 20px 0;
      position: relative;
      z-index: 20;
    }

    .nav-link,
    .dropdown-toggle {
      font-family: "Poppins", sans-serif;
      font-size: 1rem;
      color: var(--white);
      transition: 0.18s ease;
      display: inline-block;
    }

    .nav-link:hover,
    .dropdown-toggle:hover {
      color: var(--light);
    }

    .nav-link:active,
    .nav-link.active-link,
    .dropdown-toggle:active,
    .dropdown-toggle.active-link {
      color: var(--yellow);
    }

    .nav-dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-toggle {
      cursor: pointer;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      min-width: 290px;
      background: var(--blue);
      border: 1px solid rgba(242, 242, 235, 0.18);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
      z-index: 30;
    }

    .memory-dropdown-menu {
      min-width: 200px;
    }

    .nav-dropdown:hover .dropdown-menu,
    .nav-dropdown:focus-within .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      font-family: "Poppins", sans-serif;
      font-size: 0.95rem;
      color: var(--white);
      padding: 12px 16px;
      transition: 0.18s ease;
      font-weight: 400;
    }

    .dropdown-item:hover {
      background: var(--yellow);
      color: var(--light);
    }

    .dropdown-item:active,
    .dropdown-item.active-dropdown {
      background: var(--yellow);
      color: var(--light);
      font-weight: 600;
    }

    .mobile-nav-overlay {
      display: none;
    }

    .page {
      width: 100%;
      padding: 52px 20px 120px;
    }

    .story-shell {
      max-width: var(--story-width);
      margin: 0 auto;
    }

    .back-button-fixed {
      position: fixed;
      left: 80px;
      bottom: 80px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: "Poppins", sans-serif;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(242, 242, 235, 0.82);
      background: var(--muted-button);
      border: 1px solid var(--muted-button-border);
      padding: 10px 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .back-button-fixed:hover {
      background: #323232;
      color: var(--white);
      border-color: rgba(242, 242, 235, 0.24);
    }

    .story-hero {
      margin-bottom: 34px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) 250px;
      gap: 24px;
      align-items: center;
    }

    .hero-copy h1 {
      font-family: "Poppins", sans-serif;
      color: var(--yellow);
      font-size: clamp(2.2rem, 4vw, 3.45rem);
      line-height: 1.14;
      margin-bottom: 10px;
    }

    .story-subtitle {
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(242, 242, 235, 0.92);
      font-style: italic;
    }

    .hero-image {
      width: 100%;
      max-width: 250px;
      justify-self: end;
      border: 1px solid rgba(242, 242, 235, 0.12);
      background: rgba(242, 242, 235, 0.03);
    }

    .hero-image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .story-body {
      display: block;
    }

    .story-body p {
      font-size: 1.04rem;
      line-height: 1.95;
      color: rgba(242, 242, 235, 0.92);
      text-align: justify;
      margin-bottom: 18px;
    }

    .intro-box {
      border: 1px solid var(--yellow);
      background: rgba(250, 227, 172, 0.12);
      padding: 18px 20px;
      margin: 0 0 28px;
    }

    .intro-box p:last-child {
      margin-bottom: 0;
    }

    .float-image {
      width: 260px;
      max-width: 42%;
      margin: 8px 0 14px 24px;
      float: right;
      border: 1px solid rgba(242, 242, 235, 0.12);
      background: rgba(242, 242, 235, 0.03);
    }

    .float-image.left {
      float: left;
      margin: 8px 24px 14px 0;
    }

    .float-image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-caption {
      margin-top: 8px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--light);
      font-style: italic;
      text-align: center;
      padding: 0 8px 10px;
    }

    .references-end {
      clear: both;
      margin: 44px auto 0;
      width: 100%;
      max-width: var(--story-width);
    }

    .ref-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-family: "Poppins", sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--white);
      background: transparent;
      border: 1px solid var(--panel-border);
      padding: 10px 14px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .ref-toggle:hover {
      border-color: rgba(250, 227, 172, 0.45);
      color: var(--yellow);
    }

    .ref-toggle-icon {
      font-size: 0.92rem;
      line-height: 1;
      transition: transform 0.18s ease;
    }

    .references-end.open .ref-toggle-icon {
      transform: rotate(180deg);
    }

    .ref-menu {
      display: none;
      margin-top: 8px;
      border: 1px solid var(--panel-border);
      background: var(--blue);
      width: 100%;
      padding: 0;
    }

    .references-end.open .ref-menu {
      display: block;
    }

    .ref-item {
      padding: 12px 14px;
      font-family: "Lato", sans-serif;
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--white);
      border-bottom: 1px solid rgba(242, 242, 235, 0.1);
      word-break: break-word;
    }

    .ref-item:last-child {
      border-bottom: none;
    }

    .ref-item a {
      color: var(--white);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .ref-item a:hover {
      color: var(--yellow);
    }

    @media (max-width: 768px) {
      .topbar {
        padding: 16px 12px 12px;
        position: relative;
      }

      .brand {
        font-size: 1rem;
        line-height: 1.25;
      }

      .mobile-menu-btn {
        display: inline-flex;
      }

      .divider {
        z-index: 200;
      }

      .navbar {
        display: none;
      }

      .mobile-nav-overlay {
        position: fixed;
        inset: 0;
        z-index: 1200;
        background: rgba(26, 26, 26, 0.98);
        padding: 88px 18px 28px;
        overflow: auto;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.22s ease, visibility 0.22s ease;
      }

      .mobile-nav-overlay.open {
        display: block;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .mobile-nav-group {
        display: grid;
        gap: 10px;
      }

      .mobile-nav-link {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "Poppins", sans-serif;
        font-size: 1rem;
        line-height: 1.35;
        color: var(--white);
        background: transparent;
        border: 1px solid rgba(242, 242, 235, 0.16);
        min-height: 50px;
        padding: 12px 14px;
        text-align: left;
      }

      .mobile-nav-link.active-link {
        color: var(--yellow);
        border-color: rgba(250, 227, 172, 0.55);
      }

      .page {
        padding: 34px 12px 110px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .hero-copy h1 {
        font-size: clamp(1.9rem, 7vw, 2.8rem);
        line-height: 1.16;
      }

      .story-subtitle {
        font-size: 0.96rem;
        line-height: 1.55;
      }

      .hero-image {
        max-width: 210px;
        justify-self: start;
      }

      .story-body p {
        font-size: 1rem;
        line-height: 1.85;
        text-align: left;
      }

      .intro-box {
        padding: 16px 14px;
        margin-bottom: 22px;
      }

      .float-image,
      .float-image.left {
        float: none;
        width: 100%;
        max-width: 100%;
        margin: 14px 0 18px;
      }

      .references-end {
        max-width: 100%;
        margin-top: 34px;
      }

      .back-button-fixed {
        left: 16px;
        bottom: 16px;
        font-size: 0.7rem;
        padding: 10px 13px;
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 28px 12px 104px;
      }

      .story-hero {
        margin-bottom: 24px;
      }

      .hero-grid {
        gap: 14px;
      }

      .hero-copy h1 {
        font-size: clamp(1.7rem, 8vw, 2.25rem);
        margin-bottom: 8px;
      }

      .hero-image {
        max-width: 180px;
      }

      .story-body p {
        font-size: 0.97rem;
        line-height: 1.75;
        margin-bottom: 16px;
      }

      .intro-box {
        padding: 14px 12px;
      }

      .image-caption {
        font-size: 0.78rem;
        line-height: 1.45;
        padding: 0 8px 8px;
      }

      .ref-toggle {
        font-size: 0.74rem;
        padding: 10px 12px;
      }

      .ref-item {
        font-size: 0.88rem;
        line-height: 1.55;
        padding: 11px 12px;
      }

      .back-button-fixed {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
        justify-content: center;
      }
    }
  </style>
</head>
